services:
  - type: web
    name: una-chat-lab5
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      - key: OKTA_ISSUER_URI
        sync: false
      - key: OKTA_CLIENT_ID
        sync: false
      - key: OKTA_CLIENT_SECRET
        sync: false
      - key: REDIRECT_URI
        sync: false
      - key: PORT
        value: 3000
      - key: SECRET
        sync: false
