name: CI/CD Pipeline - SAST + Linting + Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  # Job 1: Linting - Análisis sintáctico y de estilo
  linting:
    name: Linting con ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint -- --max-warnings 20
        continue-on-error: false

      - name: Generar reporte de ESLint
        if: always()
        run: |
          npm run lint -- --format json --output-file eslint-report.json || true
          npm run lint -- --format html --output-file eslint-report.html || true

      - name: Subir reportes de linting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linting-reports
          path: |
            eslint-report.json
            eslint-report.html
          retention-days: 30

  # Job 2: Unit Tests - Pruebas basadas en BDD
  unit-tests:
    name: Unit Tests con Jest (BDD)
    runs-on: ubuntu-latest
    needs: linting

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests con cobertura
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=html
        continue-on-error: false

      - name: Verificar umbral de cobertura
        run: npm test -- --coverage --coverageThreshold='{"global":{"branches":70,"functions":70,"lines":70,"statements":70}}'
        continue-on-error: true

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Comentar cobertura en PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # Job 3: SAST - Análisis de seguridad estático
  sast-codeql:
    name: SAST - CodeQL Analysis
    runs-on: ubuntu-latest
    needs: linting
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended,security-and-quality

      - name: Ejecutar análisis CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  sast-semgrep:
    name: SAST - Semgrep Analysis
    runs-on: ubuntu-latest
    needs: linting

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/nodejs
            p/owasp-top-ten
            p/javascript
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  sast-snyk:
    name: SAST - Snyk Security Scan
    runs-on: ubuntu-latest
    needs: linting

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Snyk para código
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects
          command: code test

      - name: Ejecutar Snyk para dependencias
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          command: test

      - name: Subir resultados a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif
        continue-on-error: true

  # Job 4: Dependency Check - Análisis de dependencias
  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    needs: linting

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Auditoría de dependencias con npm
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Generar reporte de auditoría
        run: |
          npm audit --json > npm-audit-report.json || true

      - name: Subir reporte de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: npm-audit-report.json
          retention-days: 30

  # Job 5: Quality Gate - Validación final
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, sast-codeql, sast-semgrep, dependency-check]
    if: always()

    steps:
      - name: Verificar estado de jobs
        run: |
          echo "Linting: ${{ needs.linting.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "CodeQL: ${{ needs.sast-codeql.result }}"
          echo "Semgrep: ${{ needs.sast-semgrep.result }}"
          echo "Dependency Check: ${{ needs.dependency-check.result }}"

          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "❌ Quality Gate FAILED: Unit tests must pass"
            exit 1
          fi

          if [[ "${{ needs.linting.result }}" != "success" ]]; then
            echo "❌ Quality Gate FAILED: Linting must pass"
            exit 1
          fi

          echo "✅ Quality Gate PASSED: All critical checks passed"

      - name: Crear badge de estado
        if: success()
        run: echo "✅ Pipeline exitoso - Código listo para deploy"
